# Paul McCartney — Wings
#
# The touring rig, not the Abbey Road one. He went direct on the records as
# often as not, and the Vox stack of the Beatles years is not modelled here.
#
# The gear here is the 1972 and 1973 Wings rig, an Acoustic 360 and 361, and
# the era this rig names is the tours after it. For the 1975 and 1976 world
# tour that made Wings Over America he played a power amplifier and preamp
# into JBLs, which this device does not model at all. So the chain is a stand
# in, said plainly in the evidence rather than left to be discovered.

schema: RigSpec
version: 2
id: paul-mccartney
aliases: [macca, mccartney]

subject:
  kind: artist
  name: Paul McCartney
  band: Wings
  era: mid to late seventies touring

instrument: bass

chain:
  - role: amp
    gear: Acoustic 360
    substitute:
      gear: Acoustic 360
      evidence:
        - kind: llm
          note: >-
            the tour rig was a power amplifier and a preamp into JBLs, and
            this device models none of those parts. The Acoustic 360 is the
            only Wings-era bass amplifier it carries, so it stands in for a
            rig it is not.
      confidence: low
    evidence:
      - kind: cited
        url: https://guitar.com/features/interviews/paul-mccartney-beatles-wings/
        note: >-
          "But the '75/'76 world tour was another matter. He had a pretty
          sizeable rig there, with two Crown 300A amps and an Audio Master
          preamp, and these drove a set of JBL speakers, a Roy Clare 2x12
          midrange bin and JBL horns." John Hammel, McCartney's assistant
          since the Beatles split, to Mark Cunningham, 18 June 2019. The same
          passage puts the Acoustic 360 on the 1972 and 1973 tours, not this
          one.
        caveat: >-
          so the Acoustic 360 here is the wrong tour's amplifier, kept only
          because nothing models a Crown, an Audio Master or a JBL. What the
          preset sounds like is a 360, and what he played through was not.
    confidence: low

  - role: cab
    gear: Acoustic 361
    substitute:
      gear: Acoustic 360
      evidence:
        - kind: llm
          note: >-
            the device carries a 1x18 named for the 360 rather than the 361.
      confidence: medium
    evidence:
      - kind: cited
        url: https://guitar.com/features/interviews/paul-mccartney-beatles-wings/
        note: >-
          the same passage gives the 1975 and 1976 tour "a set of JBL
          speakers, a Roy Clare 2x12 midrange bin and JBL horns", so the 361
          belongs to the earlier tours along with the 360 head it was part of.
        caveat: >-
          nothing here models a JBL or a Roy Clare, so the cabinet is the
          wrong tour's for the same reason the amplifier is.
    confidence: low

character:
  - term: mid-forward
    evidence:
      - kind: cited
        url: https://www.rickresource.com/forum/viewtopic.php?t=411797
        note: >-
          "that middley mid, cut through the mix flatwound tone" of the live
          Wings Over America album, recorded on the 1976 US tour
        caveat: >-
          a forum thread that blocks automated readers, so the line was read
          in search results and the page was not. Somebody should open it.
      - kind: cited
        url: https://www.talkbass.com/threads/paul-mccartney-wings-over-america-rickenbacker-4003s-4001s-tone.1408772/
        note: >-
          "sounds like he boosts low mids and rolls off the treble a little",
          about the same album
        caveat: >-
          the same kind of thread, found by search and not read. It also
          suggests a darker top, which one unread post is too thin to claim.
      - kind: audio
        note: >-
          the three records measured for him, Rain, Come Together and Silly
          Love Songs, hold 0% of their energy in the mid band against 5% for
          the other seven players in the music corpus. The lowest of the
          eight. Reproduce with `tonestack measure --corpus resources/music/bass`.
        caveat: >-
          not the record the citations describe. Both are about Wings Over
          America, a 1976 live album played on a Rickenbacker, and none of the
          three measured records is from it. Measuring that album is what
          would settle this either way.
  - term: clean
    evidence:
      - kind: audio
        measured: { harmonics: 0.10 }
        against: { harmonics: 0.24 }
        note: >-
          10% of his energy sits above the fundamental against 24% for the
          rest of the corpus, clear of the line by 5%. The cleanest of the
          nine.
        caveat: >-
          measures the record rather than the player, and two of the three are
          Beatles records cut on a Hofner rather than the Rickenbacker rig
          this describes.
  - term: dark
    evidence:
      - kind: audio
        measured: { centroid: 138 }
        against: { centroid: 176 }
        note: >-
          his centroid sits at 138Hz against 176Hz for the other eight
          players, the third darkest of the nine behind Pino Palladino at
          96Hz and Tim Commerford at 122Hz. Earned outright against seven
          players and not against eight: Commerford arriving between him and
          the middle is what took it.
        caveat: >-
          two of the three records are Beatles takes cut on a Hofner rather
          than the Rickenbacker rig this describes, and a Hofner is darker
          before any amplifier is involved.
      - kind: cited
        url: https://www.talkbass.com/threads/paul-mccartney-wings-over-america-rickenbacker-4003s-4001s-tone.1408772/
        note: >-
          the same thread behind `mid-forward` also says he "rolls off the
          treble a little", which is the half of it the records agree with
        caveat: >-
          found by search and not read, like the other citation from it
