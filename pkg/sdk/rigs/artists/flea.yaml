# Flea — Red Hot Chili Peppers
#
# The Gallien-Krueger years. The rig here is the one a rundown documents
# rather than the one most people mean: the 800RB on the early records is
# widely repeated and was not sourced to a page anybody here opened.

schema: RigSpec
version: 2
id: flea
aliases: [rhcp, michael-balzary]

subject:
  kind: artist
  name: Flea
  band: Red Hot Chili Peppers
  era: I'm With You through The Getaway
  # The rundown behind this rig is from 2012 and the switch to Ampeg came with
  # Unlimited Love in 2022, so the Gallien-Krueger years are wider than the one
  # the rundown was published in. Bounded by the records measured rather than
  # by the whole span, because the far end of it has nothing measured on it.
  years: { from: 2011, to: 2016 }

instrument: bass

chain:
  - role: amp
    gear: Gallien-Krueger 2001RB
    stage: true
    substitute:
      gear: Gallien-Krueger 800RB
      evidence:
        - kind: llm
          note: >-
            the 800RB is the only Gallien-Krueger this device models. Same
            maker, a different head, and nobody has compared them.
      confidence: low
    evidence:
      - kind: cited
        url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        note: >-
          "Flea uses three Gallien-Krueger 2001RB amps, one controls the
          other two as slaves"
      - kind: cited
        url: https://www.guitarworld.com/news/flea-red-hot-chili-peppers-unlimited-love-new-bass-amp-setup
        note: >-
          headlined as him switching to Ampeg from Gallien-Krueger for
          Unlimited Love, which dates this rig to before that
        caveat: >-
          only the headline was readable. The body did not come back.
    confidence: medium

  - role: cab
    gear: Gallien-Krueger 410
    stage: true
    substitute:
      gear: Ampeg SVT 410HLF
      evidence:
        - kind: llm
          note: >-
            nothing here models a Gallien-Krueger cabinet. A 4x10 for a 4x10,
            which is a guess about size rather than about voicing.
      confidence: low
    evidence:
      - kind: cited
        url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        note: three 410 cabinets and three 115s in the 2012 rundown
    confidence: medium

character:
  # `percussive` was here on a model's say-so. Nothing found says it of him,
  # and `technique.attack: slap` below is sourced and already carries what
  # the word was reaching for: a character term is meant to describe the
  # result, and this one only repeated the hand.
  - term: dark
    evidence:
      - kind: cited
        url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        note: >-
          "he keeps his knobs taped at his preferred settings (bass almost
          full up, treble rolled off)"
        caveat: >-
          knob positions rather than a result, which is the confusion this
          field exists to avoid: where the treble control sits says nothing
          about where the record lands.
      - kind: audio
        measured: { centroid: 134 }
        against: { centroid: 172 }
        note: >-
          his three records from this rig's own years measure a centroid of
          134Hz, third darkest of the nine players behind Tim Commerford at
          109Hz and Mike Dirnt at 126Hz. Below the middle and not clear of it,
          so the word is not earned. Reproduce with `go run main.go measure
          --corpus resources/music/bass`.
        caveat: >-
          the word is kept because a citation outranks a measurement here, and
          three records of one player are not his whole catalogue.
played:
  - gear: Fender Jazz Bass, 1961
    strings: flat
    evidence:
      # Both ends of this rig's window, in his own words, on the same bass.
      - kind: cited
        url: https://web.archive.org/web/20170504000530/http://www.bassplayer.com/artists/1171/flea-association/26543
        note: >-
          asked "What basses did you use for this record?" on I'm With You:
          "Old Fenders. I used my '61 Jazz and I used another '61 Jazz that my
          friend Damien Hirst put butterflies all over."
        caveat: >-
          two instruments, not one, and he does not say which is on which
          track. Both are 1961 Jazz Basses, so the field names what they have
          in common. bassplayer.com is gone and this is its archived copy.
          See the task on `played` carrying more than one instrument.
      - kind: cited
        url: https://www.notreble.com/buzz/2016/07/14/fender-unveils-flea-signature-jazz-bass/
        note: >-
          Fender's own text for the signature model, which recreates the bass
          "he received from a fan and used to record the Red Hot Chili Peppers
          albums Stadium Arcadium and The Getaway"
        caveat: >-
          Fender names The Getaway, the far end of this rig's window, and
          describes only the Shell Pink bass. The 2011 interview above covers
          the near end and adds the second one Fender had no reason to mention.
      # Strings. `round` stood here off the tour rundown below until somebody
      # read what is on the instrument this field actually names.
      - kind: user
        url: https://www.talkbass.com/threads/so-which-flats-is-flea-playing.269755/
        note: >-
          his bass tech, quoted from Bass Guitar Magazine by the poster Nigel:
          "the strings on his Jazz are 'old GHS flatwounds'". The same
          interview has him going back to the Modulus for live work because
          "The Jazz sounded great on stage and in in-ear monitors but got a bit
          lost in the FOH mix."
        caveat: >-
          first-hand from the tech and second-hand to us, and it is 2006 rather
          than this rig's years. Nothing found says what was on the Jazz Basses
          in 2011. It is kept because it is the only evidence about the
          instrument this rig names, and because "old" flatwounds is not a set
          somebody changes often.
      - kind: user
        url: https://www.talkbass.com/threads/what-songs-on-stadium-arcadium-does-flea-uses-flatwounds-on.457174/
        note: >-
          Bass Player's gear box for Stadium Arcadium, transcribed by the
          poster GianGian: "Flea's Gear Basses '61 Fender Jazz and '62 Fender
          Jazz, both with old flatwounds".
        caveat: >-
          a transcription of a url that is now dead, so it corroborates the
          tech rather than standing alone. It also has a '61 and a '62 where
          Flea says two '61s.
      - kind: cited
        url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        note: >-
          "Flea uses his signature set of GHS Boomers", a roundwound line
        caveat: >-
          which is why this field used to say `round`, and it was the wrong
          instrument. The 2012 rundown documents the Modulus basses he calls
          tour-only, "For the last ten years that's all I played on tour", and
          this rig names the Jazz Basses he recorded on. Two instruments, two
          sets of strings, and the records are the Jazz. The gauge printed
          there, ".105 - .145", is not a set GHS sells either.
  - gear: Fender Jazz Bass, 1961, painted by Damien Hirst
    strings: flat
    evidence:
      - kind: cited
        url: https://web.archive.org/web/20170504000530/http://www.bassplayer.com/artists/1171/flea-association/26543
        note: >-
          the second of the two he names for this record: "I used another '61
          Jazz that my friend Damien Hirst put butterflies all over. One day
          he asked me, 'What's the best bass ever made?' I said, 'Well, the
          '61 Fender Jazz Bass.'"
        caveat: >-
          no `records`, because he never says which bass took which track.
          Two instruments of the same year and model, so no figure here can
          be told apart by them and nothing pretends otherwise. Not the
          spin-art Flea Bass from the "Rain Dance Maggie" video, which is a
          different instrument and a performance rather than a session. The
          strings are the pair's, from the tech quoted above.

technique:
  attack: slap
  evidence:
    - kind: cited
      url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
      note: >-
        "MXR Micro Amp used as clean boost for slapping and leads"
      caveat: >-
        he plays fingerstyle at least as much. A rig names one attack, so
        this one is the funk material rather than the whole player.

confidence: medium
