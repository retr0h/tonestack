# Mike Dirnt — Green Day
#
# A rig names real-world gear, never Line 6 model identifiers. "Ampeg SVT"
# resolves through the gear map, so this file stays readable, stays correct
# when Line 6 rename something, and works for any Helix device.
#
# See docs/recipes.md, and examples/rigspec/mike-dirnt.yaml for a version with
# every field filled in.

schema: RigSpec
version: 2
id: mike-dirnt
aliases: [green-day, dirnt]

subject:
  kind: artist
  name: Mike Dirnt
  band: Green Day
  era: American Idiot
  years: { from: 2004, to: 2004 }

instrument: bass
default: true

# The signal path, in order. Order is what the signal does: a compressor ahead
# of the amp squeezes what the amp is fed, one after it levels what comes out.
chain:
  - role: amp
    gear: Ampeg SVT
    capture: direct
    evidence:
      - kind: cited
        url: https://en.wikipedia.org/wiki/American_Idiot#Recording
        note: >-
          "For most of the record, Dirnt used an Ampeg SVT bass amplifier,
          recording with his signature Fender Precision Bass ... he and
          Cavallo strived for a 'solid, big, thunderous' bass sound as
          opposed to one centered on countermelodies."
        caveat: >-
          Wikipedia is the reachable end of a chain, not the source. Its
          reference is Bradman, E.E. and Buddingh, Terry, "Ready Set Go!:
          Studio Secrets of Mike Dirnt and Green Day Producer Rob Cavallo",
          Bass Guitar, 18 January 2006, ISSN 1476-5217, which is print. Cite
          that if you get hold of it. The same reference carries the rest of
          the session chain, including an Evil Twin direct box "a staple of
          his recording methods since Dookie".
      - kind: cited
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        note: >-
          Bass Player, September 2004, the month of the album, and the only
          contemporaneous interview anybody here has read. It puts him on
          Fender: "a Bassman 1200 Pro head with the EQ essentially flat ...
          Each amp is connected to a Bassman 810 Pro 8x10 cabinet with the
          tweeter turned off", and "I just switched back to 8x10s".
        caveat: >-
          this is not the contradiction it looks like. The passage opens
          "Live, Dirnt goes from a Shure ULX wireless", so it is the touring
          rig, and the claim above is explicitly about the sessions. Fender
          on stage and an SVT in the studio in the same year are both true.
          Worth knowing that in this interview he prefers Fender: "I like the
          Ampeg cabs' low-end response, but the Fenders give me the attack
          I'm looking for."
    confidence: medium

  - role: cab
    gear: Acoustic 6x10
    capture: direct
    substitute:
      gear: Ampeg 8x10
      evidence:
        - kind: llm
          note: >-
            the device carries no 6x10 at all. Its nearest is a big sealed
            multi-ten, which is the 8x10 this rig used to name outright.
      confidence: low
    evidence:
      - kind: user
        url: https://www.talkbass.com/threads/i-wanna-get-a-mike-dirnt-like-tone-when-i-play-my-p-bass-how-to.1111702/
        note: >-
          Dirnt's own words, asked whether he uses his big rig in the studio,
          in a Guitar Center interview the poster EastCoastThump transcribes:
          "I've used a 6x10 combo on every record we've ever done, this old
          Acoustic 6x10 cabinet that I have ... I'd use a little 4x10 guitar
          combo for the super highs, maybe an Ampeg, and a Mesa/Boogie 6x10,
          along with some other stuff. Basically, I'll just do a blend of two
          amps."
        caveat: >-
          first-hand from him and second-hand to us: the Guitar Center link
          in the post is dead and no archived copy was found, so the
          interview cannot be dated. "Every record we've ever done" covers
          this one whenever it was said. Ampeg appears once and hedged,
          attached to a guitar combo. He also blends two amplifiers per song
          and a rig is one path, so this names the one he says is always
          there.
      - kind: cited
        url: https://www.notreble.com/buzz/2026/08/24/mike-dirnt-is-opening-his-reverb-shop-and-we-got-to-check-out-the-gear/
        note: >-
          his own Ampeg 8x10 belongs to a different record. Coverage of him
          selling his gear ties it to 1994: "one of the first Ampeg SVT-810
          cabinets he bought with his first Green Day paycheck, which
          subsequently went out on the Dookie tour". The American Idiot items
          in the same sale are basses.
        caveat: >-
          which places his own Ampeg eight by ten on a different record, and
          agrees with him about the split: the big cabinets are what he
          carries, and a six by ten is what he records through.
      - kind: cited
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        note: >-
          Bass Player, September 2004: "Each amp is connected to a Bassman
          810 Pro 8x10 cabinet with the tweeter turned off. Says Dirnt, 'For
          my tone, I don't need that spitty sound up top.'"
        caveat: >-
          his live rig, so it says the size he was carrying rather than what
          the sessions were miked through. The tweeter being off is the one
          thing here that describes a sound rather than a box.
    confidence: low

# How it should sound, in the words a person would use. Describe the result,
# not the control.
character:
  # `mid-forward` and `grit-on-attack` were here on a model's say-so, and the
  # figures beside the first were measured from Dookie and Insomniac. This rig
  # describes the American Idiot rig, and those records were made on the Mesa
  # and Yamaha amplifiers its own evidence names for other years. Measured
  # from American Idiot, where the SVT was, his records say the opposite on
  # both axes.
  - term: scooped
    evidence:
      - kind: audio
        measured: { mid: 0.01 }
        against: { mid: 0.10 }
        note: >-
          1% of his energy sits in the mid band across American Idiot, Holiday
          and St. Jimmy, against 10% for the other eight players, clear of the
          line by 2%.
        caveat: >-
          measures the record rather than the player, and that album is a
          scooped mix before the bass rig is accounted for.
  - term: clean
    evidence:
      - kind: audio
        measured: { harmonics: 0.17 }
        against: { harmonics: 0.24 }
        note: >-
          17% of his energy sits above the fundamental against 24% for the
          other eight players, clear of the line by 2%.
        caveat: >-
          measures the record rather than the player. `grit-on-attack` stood
          here until the records measuring this rig were the ones measured.
  - term: audible-pick-attack
    evidence:
      - kind: cited
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        note: >-
          Bass Player, September 2004. He names the frequency: "Dirnt can
          even pinpoint the frequency that captures the pickstyle click he
          craves on records: '2kHz,' he says." And describes it: "I also like
          a tic-tac click, like the sound of the baritone guitar parts on old
          country records, where it would double the bass line. I like the
          ice-pick-in-the-ear upper-midrange sound, and I like my bass to
          have punch."
        caveat: >-
          what he wants rather than what the record does, and on this rig
          those differ. He says in the same answer "I try to cut through with
          midrange" while American Idiot measures 1% in the mid band against
          10% for the other eight players, the most scooped record in the
          corpus. The click he is describing is upper-midrange, which a
          scooped mix keeps and a scooped amplifier would not.
  # `tight-low-end` and `short-decay` were here on a model's say-so and the
  # only person on record about this tone contradicts the first: asked to
  # describe it he says "I also like my sound to be round and warm".

played:
  gear: Fender Mike Dirnt Signature Precision Bass
  strings: round
  evidence:
    - kind: cited
      url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
      note: >-
        Bass Player, September 2004, the month American Idiot was released:
        "Dirnt uses nickel-plated medium-gauge Fender Super Bass strings,
        saying, 'They've got great snap.'"
      caveat: >-
        the set, not the winding. `round` is read off Fender's Super Bass
        line rather than off this page, which never says the word. The
        sidebar also opens "bringing a big quiver of Fender basses on the
        upcoming Green Day tour", so it describes the rig in the month of
        release rather than what was strung up in the sessions. The
        flatwounds in the same interview are his first bass, aged twelve.
    - kind: cited
      url: https://www.notreble.com/buzz/2026/08/22/mike-dirnt-is-selling-american-idiot-tour-basses-and-a-fender-used-to-record-nimrod/
      note: >-
        "two American Idiot-era Fender Mike Dirnt Signature Precisions used on
        tour", from coverage of him selling his own instruments
      caveat: >-
        this page says toured, not recorded, and describes the signature
        basses as what he is "bringing ... on the upcoming Green Day tour".
        What puts the same bass in the sessions is the source behind the
        amplifier: Bass Guitar, January 2006, "recording with his signature
        Fender Precision Bass". Print, unread here, and the same claim the
        amplifier rests on, so the bass and the amp stand or fall together.

technique:
  attack: pick
  evidence:
    - kind: cited
      url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
      note: >-
        Bass Player, September 2004, asked "Do you always play with a pick?":
        "Yeah. It's a product of starting on guitar. It just seemed more
        natural, since my rotation with my fingers isn't that good. You might
        catch me playing slap and fingerstyle before practice, but not
        onstage."
      caveat: >-
        `position` is gone. He describes what his right hand is for, "I try
        to be percussive with my right hand, finding something that has its
        own motor, with a bounce to it", and never says where along the
        string it sits.

confidence: medium

target:
  device: HX Stomp
  # Played fingered rather than with a pick. A pick puts high-frequency attack
  # into every note that fingers do not, so a rig tuned from picked playing
  # reads duller under fingers — the compensation belongs in the amp and the
  # compressor.
  technique:
    attack: fingers
