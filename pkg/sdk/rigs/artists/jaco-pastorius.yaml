# Jaco Pastorius — Weather Report
#
# The one rig here whose chain is what the records were made of. He is on
# record in 1976 taking a DI and a microphone on the 360 together, and
# saying the stage sound is "the same exact sound as I get in the studio".

schema: RigSpec
version: 2
id: jaco-pastorius
aliases: [jaco, pastorius]

subject:
  kind: artist
  name: Jaco Pastorius
  band: Weather Report
  era: Weather Report through Word of Mouth
  years: { from: 1976, to: 1981 }

instrument: bass

chain:
  - role: amp
    gear: Acoustic 360
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-jaco-pastorius/
        note: >-
          the 360-361PP, described there as an 18 inch inverted speaker
          cabinet he converted to after a borrowed one on a gig
      - kind: cited
        url: https://reverb.com/news/jaco-pastorius-on-how-he-learned-bass-and-composition-bacons-archive
        note: >-
          Tony Bacon interviewing him in London in 1976, the first year this
          rig covers, asked about amps: "I use an Acoustic 360. I've been
          using that about eight years, since they first had them. When I
          record, I have a line going direct and I have a microphone to the
          amp, so we get a little bit of both, the highs and lows. It's just
          like having two mics on a piano." Asked about the stage sound: "it's
          the same exact sound as I get in the studio."
        caveat: >-
          the cabinet is half of what the records carry rather than none of
          it, which is the opposite of what this file used to say. It stood
          on a comments section claiming he went to the board with no preamp,
          against an article on the same page saying otherwise. Expect that
          claim back: a TalkBass thread on his tone has it stated flatly,
          "That 'Jaco tone' was his bass straight into the mixing board ...
          Acoustic 360 amps have NOTHING to do with it", by somebody with no
          access to the sessions. He is on record above saying both.
    confidence: medium

  - role: cab
    gear: Acoustic 361
    substitute:
      gear: Acoustic 360
      evidence:
        - kind: llm
          note: >-
            the device carries a 1x18 named for the 360 rather than the 361
            it was sold with. The same box, as far as anything here knows.
      confidence: medium
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-jaco-pastorius/
        note: the 1x18 folded horn the 360 was sold with
    confidence: medium

character:
  - term: bridge-forward
    evidence:
      - kind: user
        url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
        note: fingers over the bridge pickup
        caveat: from the comments on that page rather than the article
  - term: bright
    evidence:
      - kind: cited
        url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
        note: >-
          1978, on why he uses the strings he does: "To me Rotosound has what
          no other string has and that's pure harmonics and the closest to
          playing harmonics in tune."
        caveat: >-
          an argument for harmonic content rather than the word itself. What
          earns the word is the measurement below.
      - kind: audio
        measured: { centroid: 259 }
        against: { centroid: 150 }
        note: >-
          his centroid across Continuum, Barbary Coast, Teen Town and Three
          Views of a Secret, against the middle of the other eight players,
          clear of the line by 21Hz. The widest centroid margin in the corpus,
          and the only word here that has survived every correction to it.
        caveat: >-
          measures the record rather than the player, and a fretless played
          near the bridge is bright before any amplifier touches it.
  - term: mid-forward
    evidence:
      - kind: audio
        measured: { mid: 0.39 }
        against: { mid: 0.06 }
        note: >-
          39% of his energy sits in the mid band against 6% for the other
          eight, clear of the line by 4% and the widest gap any player has on
          any axis here. Nobody wrote this word down before the records were
          measured.
        caveat: >-
          measures the record rather than the player: a fretless singing near
          the top of its range puts energy where a rock bass does not.
  # `audible-strings` was here on a model's say-so and he contradicts it.
  # Asked how his right hand developed, 1978: "I use my first two fingers to
  # pick and I use the other two fingers to mute as well as my thumb if I'm
  # jumping around. The hardest thing to do is just to get the strings I'm
  # not playing to shut up ... I don't think I make too much noise."
  # https://jacopastorius.com/features-2/interviews/portrait-of-jaco/

played:
  gear: Fender Jazz Bass, fretless
  strings: round
  evidence:
    - kind: cited
      url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
      note: >-
        "Portrait of Jaco", Steve Rosen, 1978, on his estate's own site, in
        the middle of this rig's years. Asked what strings he uses:
        "Rotosounds." And why: "To me Rotosound has what no other string has
        and that's pure harmonics and the closest to playing harmonics in
        tune."
      caveat: >-
        he names the brand and not the type, and in 1978 Rotosound also sold
        the Jazz Bass 77 flatwound and the Tru Bass 88 nylon tapewound, which
        their own history confirms. `round` is therefore inferred twice over:
        the argument he makes is about brightness and harmonic content, which
        is a roundwound argument, and the fingerboard is epoxied, which is
        what roundwounds on a bare fretless board make necessary. No gauge:
        the set everybody names comes from present-day aggregators.
  # The word this rig earns from its records is `bright`, at 259Hz against
  # 170Hz for the other eight players, and a fretless played near the bridge
  # is bright before an amplifier is involved. Without this field that figure
  # reads as the Acoustic 360's doing.

technique:
  attack: fingers
  position: bridge
  muting: palm
  evidence:
    - kind: cited
      url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
      note: >-
        1978, his own account of his right hand: "I never practiced with my
        right hand at all. It just naturally goes. I use my first two fingers
        to pick and I use the other two fingers to mute as well as my thumb
        if I'm jumping around. The hardest thing to do is just to get the
        strings I'm not playing to shut up."
      caveat: >-
        `muting` says palm because this format has no word for muting with
        the fingers that are not picking, which is what he describes. The
        effect on the sound is the same and the hand is not.
    - kind: user
      url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
      note: playing over the bridge pickup
      caveat: >-
        from the comments rather than the article, and the position is all
        it supports.

confidence: medium
