# Les Claypool — Primus
#
# The nineties rig, which is the sound on the records. He plays Mesa Subway
# heads now.

schema: RigSpec
version: 2
id: les-claypool
aliases: [claypool, primus]

subject:
  kind: artist
  name: Les Claypool
  band: Primus
  era: Sailing the Seas of Cheese through Tales from the Punchbowl

instrument: bass

chain:
  - role: amp
    gear: Mesa/Boogie Bass 400+
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
        note: >-
          the Bass 400+ head through the nineties, into two Mesa 2x15 Diesel
          cabinets
        caveat: >-
          the same rundown has him on Subway D-800 heads and 1x12s now, so
          this rig is the earlier era.
    confidence: high

  - role: cab
    gear: Mesa/Boogie 2x15
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
        note: two 2x15 Mesa/Boogie Diesel cabinets
    confidence: medium

character:
  - term: loose-low-end
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
        note: described there as a heavy, thumping tone
  - term: bright
    evidence:
      - kind: llm
        caveat: >-
          not sourced. This was split off a line saying "thumping low end
          under a hard top", and the rundown behind that line describes the
          low end and says nothing about the top.
      - kind: audio
        note: >-
          his centroid sits at 264Hz, the highest middle of the eight players
          in the music corpus, so the records point the way the word does. It
          is not earned: Wynona's Big Brown Beaver reads 114Hz against 264Hz
          and 275Hz for the other two, and a player whose own records
          disagree that much is clear of nobody.
        caveat: >-
          a fourth record would say whether that one is the outlier or the
          other two are.
  - term: percussive
    evidence:
      - kind: llm

technique:
  attack: slap
  evidence:
    - kind: cited
      url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
      note: a rapid slapped and tapped style
      caveat: >-
        tapping is half of it and this format has no word for that.

confidence: medium
