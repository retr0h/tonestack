# Pino Palladino — D'Angelo, Voodoo
#
# A P-Bass tuned down, flatwounds, tone rolled off, into a mic'd B-15. The
# rig is almost beside the point and the strings are not.

schema: RigSpec
version: 2
id: pino-palladino
aliases: [pino, palladino]

subject:
  kind: artist
  name: Pino Palladino
  band: D'Angelo
  era: Voodoo

instrument: bass

chain:
  - role: amp
    gear: Ampeg B-15
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: >-
          the Voodoo configuration, "recorded from the amp without using a
          DI"
    confidence: high

  - role: cab
    gear: Ampeg B-15
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: the B-15 is a combo, so the cabinet is the amplifier
    confidence: high

character:
  - term: dark
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: '"keeping the volume turned all the way up and the tone all the way down"' 
  - term: short-decay
    evidence:
      - kind: llm
        note: inferred from the flatwounds, which the rundown does name
        caveat: >-
          not sourced. Flatwounds and a short decay go together and the
          rundown does not say so, which makes this a reasonable guess and
          not a citation.
  - term: quiet-strings
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: flatwounds named there as a major component of the sound
        caveat: >-
          strings are not modelled by anything. This term is here for a
