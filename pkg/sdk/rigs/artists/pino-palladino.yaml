# Pino Palladino — D'Angelo, Voodoo
#
# A P-Bass tuned down, flatwounds, tone rolled off, into a mic'd B-15. The
# rig is almost beside the point and the strings are not.

schema: RigSpec
version: 2
id: pino-palladino
aliases: [pino, palladino]

subject:
  kind: artist
  name: Pino Palladino
  band: D'Angelo
  era: Voodoo
  years: { from: 2000, to: 2000 }

instrument: bass

chain:
  - role: amp
    gear: Ampeg B-15
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: >-
          the Voodoo configuration, "recorded from the amp without using a
          DI"
      - kind: cited
        url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
        note: >-
          Pino, asked what he used to record: "I plugged into a miked Ampeg
          B-15, and I'm pretty sure that was the only signal we took."
        caveat: >-
          the one rig here whose records went through a microphone and a
          cabinet rather than to the desk. Claypool, Dirnt, Geddy and
          McCartney all went direct in whole or in part, so this chain
          describes what was recorded more literally than any other.
    confidence: high

  - role: cab
    gear: Ampeg B-15
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: the B-15 is a combo, so the cabinet is the amplifier
    confidence: high

character:
  - term: dark
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: '"keeping the volume turned all the way up and the tone all the way down"'
      - kind: audio
        measured: { centroid: 96 }
        against: { centroid: 172 }
        note: >-
          his centroid sits at 96Hz against 172Hz for the other eight players,
          the darkest of the nine. Clear of the line by 3Hz, where it was 28Hz
          before the four rigs measuring records from the wrong era were
          corrected: Tim Commerford at 109Hz and Mike Dirnt at 126Hz now sit
          between him and the middle.
        caveat: >-
          measures the record rather than the player, and all three records
          are one album cut by one engineer.
  - term: scooped
    evidence:
      - kind: audio
        measured: { mid: 0.02 }
        against: { mid: 0.10 }
        note: >-
          2% of his energy sits in the mid band against 10% for the other
          eight players. Earned, and by the narrowest margin in the corpus:
          0.1%, which one more player between him and the middle would take.
        caveat: >-
          measures the record rather than the player. Read the margin before
          believing this one.
  # `short-decay` was here, inferred from the flatwounds and sourced to
  # nobody. Pino says the reason for the heavy flats was the tuning rather
  # than the decay, and nothing found describes note length on this record.
  - term: quiet-strings
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: flatwounds named there as a major component of the sound
        caveat: >-
          strings are not modelled by anything. This term is here for a
          reader, not for the compiler.

played:
  gear: Fender Precision Bass, 1963
  strings: flat
  evidence:
    - kind: cited
      url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
      note: the 1963 Precision with flatwounds is what the rundown describes
    - kind: cited
      url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
      note: >-
        Pino's own answer: "I played either my '63 P-Bass tuned down to D or
        my Moon Larry Graham signature 4-string tuned down to C#. Both had
        heavy-gauge La Bella flatwounds, which can be rough on necks; that's
        originally why I tuned down the Precision."
      caveat: >-
        two instruments, and he does not say which track took which. The
        tuning is the part this rig cannot carry: a whole tone down on heavy
        flats is most of why he reads 96Hz, the darkest of the nine players,
        and no field here holds a tuning.

technique:
  attack: fingers
  muting: palm
  evidence:
    - kind: cited
      url: https://web.archive.org/web/20110518211048/http://bassplayer.com/article/pino-palladino-steps/April-2011/130905
      note: >-
        Bass Player, April 2011, Chris Jisi, Pino describing the technique he
        brought from this period: "the fingerstyle technique I developed
        playing hip-hop on my P-Bass, where I pluck the E string with my
        thumb, the A with my index finger, the D with my middle finger, and
        the G with my ring finger, all while muting with my palm."
      caveat: >-
        `fingers` is his own word for it and the lowest string is not one:
        the E is plucked with his thumb, and on this record that is the
        string tuned down to D, so it is the one doing most of the work. The
        interview is 2011 and describes carrying an existing technique
        forward, so it is close to this era rather than inside it.

confidence: medium
