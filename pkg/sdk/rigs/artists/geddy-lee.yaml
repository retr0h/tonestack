# Geddy Lee — Rush
#
# The Ampeg years. He used Ampeg from the first record to Hemispheres, and
# everything after that is a Wal, a Trace Elliot or an Orange, none of which
# this device models.

schema: RigSpec
version: 2
id: geddy-lee
aliases: [geddy, rush]

subject:
  kind: artist
  name: Geddy Lee
  band: Rush
  era: Fly by Night through Hemispheres

instrument: bass

chain:
  - role: amp
    gear: Ampeg SVT
    evidence:
      - kind: user
        url: https://www.talkbass.com/threads/geddy-lee-amps.847050/
        note: >-
          Ampeg from the first album to about Hemispheres. By 2112, two SVTs,
          one into Sunn 215s and one into Ampeg V4b 215s.
        caveat: >-
          this thread blocks automated readers, so it was found by search and
          not read. Somebody should open it.
    confidence: medium

  - role: cab
    gear: Ampeg 8x10
    evidence:
      - kind: user
        url: https://www.talkbass.com/threads/geddy-lee-amps.847050/
        note: the SVT-810 in the Fly by Night footage
        caveat: the same unread thread
    confidence: medium

character:
  # `bright` was here on a model's say-so until his records were measured. His
  # centroid sits at 177Hz, the middle of the eight players in the music
  # corpus, with Claypool at 264Hz, Jaco at 259Hz and Bootsy at 214Hz above
  # him. Audio outranks a model here, so the word is gone rather than argued
  # with. What his records do say is that he is the most saturated of the
  # eight, at 29% against a middle of 24%, which is not clear enough of the
  # rest to earn `saturated` either.
  - term: percussive
    evidence:
      - kind: user
        url: https://www.talkbass.com/threads/how-do-you-get-that-aggresive-geddy-lee-sound.764407/
        note: a thread on the aggressive right hand
        caveat: >-
          opinion rather than measurement, and the thread blocks automated
          readers so it was not read

technique:
  attack: fingers
  evidence:
    - kind: user
      url: https://www.talkbass.com/threads/how-do-you-get-that-aggresive-geddy-lee-sound.764407/
      note: digging in hard with the right hand
      caveat: the same unread thread

confidence: low
