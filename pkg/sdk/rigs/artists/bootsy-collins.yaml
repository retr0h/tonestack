# Bootsy Collins — Parliament-Funkadelic
#
# The one rig here whose amplifier this device cannot do. The envelope
# filter is the sound anyway, and that is modelled.

schema: RigSpec
version: 2
id: bootsy-collins
aliases: [bootsy, william-collins]

subject:
  kind: artist
  name: Bootsy Collins
  band: Parliament-Funkadelic
  era: Stretchin' Out through Ahh... The Name Is Bootsy
  years: { from: 1976, to: 1977 }

instrument: bass

chain:
  - role: other
    gear: Mu-Tron III
    settings:
      # Line 6 ship this model fully wet and nobody has measured how much dry
      # signal Bootsy keeps under his. This says the default out loud rather
      # than claiming something nobody checked.
      mix: 1.0
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
        note: >-
          "since the '70s, Bootsy has been a devout user of the Musictronics
          Mu-Tron III Envelope Filter"
    confidence: high

  - role: amp
    gear: Alembic F2-B
    substitute:
      gear: Ampeg B-15
      evidence:
        - kind: llm
          note: >-
            a model's guess at the nearest clean tube bass preamp this device
            carries. Nobody has compared them.
      confidence: low
    evidence:
      - kind: cited
        url: https://www.uberproaudio.com/who-plays-what/295-bootsy-collins-bass-rig-gear-and-equipment
        note: >-
          an Alembic F2-B preamp into Crown power amps and eight custom
          Electro-Voice cabinets
        caveat: >-
          nothing on this device emulates the F2-B, and the power amps and
          cabinets are custom. What is here is the filter and something clean
          behind it.
    confidence: medium

character:
  - term: envelope-swept
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
        note: '"a squelchy, synth-like tone when playing leads or slap"' 
  # `clean` was here on a model's say-so. His records measure 22% of their
  # energy above the fundamental against a middle of 24%, which is the middle
  # of the corpus rather than the clean end of it, so the word is gone.
  - term: mid-forward
    evidence:
      - kind: audio
        measured: { mid: 0.23 }
        against: { mid: 0.06 }
        note: >-
          23% of his energy sits in the mid band across the four records,
          against 6% for the other eight players, clear of the line by 4%.
          Earned against every corpus this has been measured against.
        caveat: >-
          measures the record rather than the player, and the envelope filter
          this rig is mostly about is a mid-band effect: the figure describes
          the Mu-Tron as much as the bass.
played:
  gear: Space Bass
  # `unknown` because somebody looked. The only flatwound line anybody has
  # from him is about the Vox Apollo he played with James Brown around
  # 1970, described as it stands in 2017: "those old flatwound strings on
  # top of that hollow Vox bass guitar." Different bass, different decade,
  # and he does not say the strings are original. Every "Bootsy used
  # flatwounds" claim found traces back to that one sentence. His DR
  # signature set is present-day and carries no endorsement date.
  strings: unknown
  evidence:
    - kind: cited
      url: https://www.discogs.com/release/570769
      note: >-
        the Stretchin' Out sleeve credits "Bootsy Collins — Bass [Space
        Bass]" and names who built it, "Sir Larry Pless" and "Gus Zuppi
        Music". The 1977 album's sleeve credits the Space Bass the same way.
      caveat: >-
        a sleeve transcription rather than a scan, though it is consistent
        across independent pressings. An instrument credit is the label's
        claim about the sessions, which is the strongest thing here, and it
        is contradicted below.
    - kind: cited
      url: https://web.archive.org/web/2020/https://www.angelfire.com/music2/pfunk/feat-spacebass.html
      note: >-
        the builder's own account: called to Los Angeles for the Stretchin'
        Out cover shoot, "I had the bass about half built ... The bass had a
        coat of white paint on it and the pick-guard and thats about all."
      caveat: >-
        which makes the bass on that sleeve photograph an unplayable body,
        and breaks the inference everybody draws from the cover. It does not
        settle the sessions: the album was cut across 1975 and 1976, so the
        bass could have been finished between the tracking and the shoot.
        Pless never dates the completion, and the first use he describes is
        a Cincinnati show rather than a studio.
    - kind: cited
      url: https://www.premierguitar.com/artists/bootsy-collins-bass-from-outer-space
      note: >-
        his own words on the P-Funk sessions generally: "No, I went back to
        the P bass ... The first recordings I did with Parliament Funkadelic
        were with that P bass."
      caveat: >-
        he never names these two albums. Stretchin' Out was cut at United
        Sound alongside Mothership Connection, which makes the Precision a
        live possibility for it, and that is an inference rather than a
        finding. The field keeps what the sleeve says.

technique:
  attack: slap
  evidence:
    - kind: cited
      url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
      note: the filter described as used "when playing leads or slap"
      caveat: >-
        which is the effect being described rather than his hands. Not a
        statement about attack from anybody who watched him.

confidence: low
