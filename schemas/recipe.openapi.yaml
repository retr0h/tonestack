openapi: 3.0.3
info:
  title: Recipe
  version: "1.0.0"
  description: >
    Curated knowledge about how a sound is built: which gear a player or style
    uses, and how it should behave.

    A Recipe is an input to preset generation; a RigSpec is the output. A
    Recipe names real-world gear ("Ampeg SVT") and never a device model
    identifier, so one Recipe serves every Helix device and survives Line 6
    renaming a model.

    This document is the source for the Go types in pkg/recipe. Do not
    hand-edit those; change this and run `just generate`.
paths: {}
components:
  schemas:
    Kind:
      type: string
      description: Whether this describes a named player or a style.
      enum: [artist, genre]
      x-enum-varnames: [KindArtist, KindGenre]

    Instrument:
      type: string
      description: >
        Selects which half of the device catalog is eligible. Line 6 tags every
        amp and cab Guitar or Bass.
      enum: [guitar, bass]
      x-enum-varnames: [InstrumentGuitar, InstrumentBass]

    Source:
      type: string
      description: >
        Where a recipe's knowledge came from. `llm` means a model asserted it
        and nobody checked — reliable for well-known players, unreliable for
        obscure ones, and the model cannot always tell which it is doing.
        `curated` and `cited` outrank it.
      enum: [llm, curated, cited]
      x-enum-varnames: [SourceLLM, SourceCurated, SourceCited]

    Confidence:
      type: string
      description: How far a recipe's claims should be trusted.
      enum: [low, medium, high]
      x-enum-varnames: [ConfidenceLow, ConfidenceMedium, ConfidenceHigh]

    Rig:
      type: object
      description: >
        The stable layer: career-long for a player, definitional for a style. A
        wrong amp here is a bad miss that nothing downstream recovers from.
      required: [amp]
      properties:
        instrument:
          type: string
          description: >
            The guitar or bass itself. Not modelled by the device, but it
            informs pickup character and output level.
        amp:
          type: string
          minLength: 1
          description: Real-world amplifier, resolved through the gear map.
        cab:
          type: string
          description: >
            Real-world speaker cabinet. Omit to accept the amp's default
            pairing, which Line 6 states as `cablink`.
        pedals:
          type: array
          items: { type: string, minLength: 1 }
          description: Real-world pedals in signal order.
        technique:
          type: string
          description: >
            How the instrument is played, where it changes the sound —
            "pick, near the bridge", "fingerstyle", "palm muted".

    Character:
      type: array
      description: >
        How it should sound, in the words a person would use. The generator
        turns these into parameter moves against the catalog's real ranges.
        Describe the result, not the control.
      items: { type: string, minLength: 1 }

    Variant:
      type: object
      description: >
        A per-song or per-era departure. Settings move; gear does not.
      required: [id, name]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          x-go-name: ID
        name:
          type: string
          minLength: 1
        character:
          $ref: '#/components/schemas/Character'
        technique:
          type: string
          description: Overrides the rig's technique for this variant only.

    Provenance:
      type: object
      description: >
        Where this came from and how far to trust it. Not decoration — it is
        what separates a confirmed fact from a model's assertion.
      required: [source, confidence]
      properties:
        source:
          $ref: '#/components/schemas/Source'
        confidence:
          $ref: '#/components/schemas/Confidence'
        url:
          type: string
          description: The source, when cited.
          x-go-name: URL
        notes:
          type: string
          description: >
            What specifically is uncertain, so a reader knows what to check
            first.

    Recipe:
      type: object
      description: Curated knowledge about one player or style.
      required: [id, kind, name, instrument_type, rig, provenance]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Stable identifier, matching the filename stem.
          x-go-name: ID
        kind:
          $ref: '#/components/schemas/Kind'
        name:
          type: string
          minLength: 1
        band:
          type: string
          description: The act the player is best known for.
        instrument_type:
          $ref: '#/components/schemas/Instrument'
          x-go-name: InstrumentType
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: Other ways a person might ask for this.
        rig:
          $ref: '#/components/schemas/Rig'
        character:
          $ref: '#/components/schemas/Character'
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
        provenance:
          $ref: '#/components/schemas/Provenance'
