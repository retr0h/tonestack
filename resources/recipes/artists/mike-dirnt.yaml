# Mike Dirnt — Green Day
#
# A rig names real-world gear, never Line 6 model identifiers. "Ampeg SVT"
# resolves through the gear map, so this file stays readable, stays correct
# when Line 6 rename something, and works for any Helix device.
#
# See docs/recipes.md, and examples/rigspec/mike-dirnt.yaml for a version with
# every field filled in.

schema: RigSpec
version: 2
id: mike-dirnt
aliases: [green-day, dirnt]

subject:
  kind: artist
  name: Mike Dirnt
  band: Green Day
  era: Dookie through American Idiot

instrument: bass
default: true

# The signal path, in order. Order is what the signal does: a compressor ahead
# of the amp squeezes what the amp is fed, one after it levels what comes out.
chain:
  - role: amp
    gear: Ampeg SVT
    evidence:
      - kind: llm
        note: >-
          Model knowledge, not a cited source. Not confirmed against a rig
          rundown or an interview.
      - kind: video
        url: https://www.youtube.com/watch?v=NDjtguZG6iw
        note: a listening reference, not a citation
        caveat: >-
          nothing has measured this, and nobody has confirmed what is in the
          signal path on it
    confidence: medium

  - role: cab
    gear: Ampeg 8x10
    evidence:
      - { kind: llm }
    confidence: medium

# How it should sound, in the words a person would use. Describe the result,
# not the control.
character:
  - term: mid-forward, not scooped
    evidence:
      - { kind: llm }
  - term: minimal drive, grit only on hard attack
    evidence:
      - { kind: llm }
  - term: tight low end, short decay
    evidence:
      - { kind: llm }
  - term: pick attack audible
    evidence:
      - kind: video
        url: https://www.youtube.com/watch?v=NDjtguZG6iw
        note: audible on the recording, which is the one claim here anybody can check

technique:
  attack: pick
  position: bridge
  evidence:
    - kind: video
      url: https://www.youtube.com/watch?v=NDjtguZG6iw
      note: visible in the footage
      caveat: >-
        one performance. Nothing here says it is what he does on the record.

confidence: medium

target:
  device: HX Stomp
  # Played fingered rather than with a pick. A pick puts high-frequency attack
  # into every note that fingers do not, so a rig tuned from picked playing
  # reads duller under fingers — the compensation belongs in the amp and the
  # compressor.
  technique:
    attack: fingers
