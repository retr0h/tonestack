<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="tonestack">
  <title>tonestack</title>

  <!-- A tone stack is the bass, mid and treble circuit in a valve amplifier.
       Three knobs, set differently, in the amber the CLI paints its accent. -->
  <g fill="none" stroke="#ffa032" stroke-width="4">
    <circle cx="36" cy="60" r="24"/>
    <circle cx="100" cy="60" r="24"/>
    <circle cx="164" cy="60" r="24"/>
  </g>

  <g stroke="#ffa032" stroke-width="5" stroke-linecap="round">
    <line x1="36" y1="60" x2="22" y2="44"/>
    <line x1="100" y1="60" x2="100" y2="38"/>
    <line x1="164" y1="60" x2="180" y2="46"/>
  </g>

  <text x="210" y="82"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="62" font-weight="600" fill="#ffa032">tonestack</text>
</svg>
