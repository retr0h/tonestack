---
# Coverage target for this repository.
#
# Not 100%: pkg/sdk/usb.go is every call this project makes into libusb, one
# expression per method, and unreachable without a device on the bus. It is
# counted rather than excluded, because an exclusion hides a file's size and a
# target gets worse if that file grows.
#
# The threshold absorbs rounding, not regression. With precision 2 and round
# down, a change in statement count can render a genuine 100% as just under it and
# fail the status on an artifact.
#
# There is deliberately no `ignore:` list. Exclusions are defined once in
# .coverignore and applied before the profile is uploaded, so excluded files
# never reach Codecov. A second list here would be free to drift from that one.
coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: 99%
        threshold: 0.05%
    patch:
      default:
        target: 99%
        threshold: 0.05%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
