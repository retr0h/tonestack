# A rig read off a device, not written by hand.
#
# Produced by `tonestack presets show --preset` from a preset an HX Stomp
# actually wrote, and committed exactly as it came out. Nobody typed it, and
# nothing here is an opinion: every value is what the hardware held.
#
# It is the other half of what a rig is for. mike-dirnt.yaml is somebody
# saying what they want, with evidence and confidence and character. This is
# a device saying what it has, which is where footswitches, snapshots, the
# controller assignments under somebody's foot and the routing a device wraps
# a chain in come from. A rig written by hand carries none of those and does
# not need to.
#
# Read it beside mike-dirnt.yaml rather than instead of it. Between them they
# exercise the whole format, which a test asserts: every field the contract
# declares appears in a rig this repository ships or shows.
#
# Three things to notice.
#
# `models` records the exact model each block resolved to, keyed by device,
# so this rebuilds the preset it came from rather than a similar one.
#
# `params` holds the device's own parameter names beside the `@`-prefixed
# attributes a chain has no opinion about, kept verbatim so that writing it
# back produces the file that was read.
#
# `rest`, under a footswitch, is everything the device stored there that this
# format does not model. It is kept rather than dropped, which is what lets a
# preset survive a round trip through a format that does not claim to
# understand all of it.

